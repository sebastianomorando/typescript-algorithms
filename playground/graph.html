<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7f2" />
    <title>Graph Lab</title>
    <link rel="stylesheet" href="./graph.css" />
    <script type="module" src="./graph-editor.ts"></script>
  </head>
  <body>
    <header class="header">
      <a class="brand" href="./index.html" aria-label="Torna all'editor di alberi">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M6 7.5 17.5 11M7 9l3.5 9M12.5 18l5-5"/><circle cx="5" cy="6" r="2.5"/><circle cx="19" cy="11.5" r="2.5"/><circle cx="11" cy="19" r="2.5"/></svg>
      </a>
      <div class="toolbar" role="toolbar" aria-label="Strumenti del grafo">
        <button id="select-tool" class="tool active" type="button" aria-label="Seleziona e sposta" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m5 3 13 10-6 1-3 6z"/></svg></button>
        <button id="node-tool" class="tool" type="button" aria-label="Aggiungi nodo" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10" cy="12" r="6"/><path d="M19 5v8M15 9h8"/></svg></button>
        <button id="edge-tool" class="tool" type="button" aria-label="Aggiungi arco selezionando due nodi" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M7.5 17 17 7"/><circle cx="5.5" cy="19" r="2.5"/><circle cx="19" cy="5" r="2.5"/></svg></button>
        <span class="divider" aria-hidden="true"></span>
        <button id="automatic-tool" class="tool" type="button" aria-label="Calcola i valori dalla lunghezza degli archi" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m4 18 14-14 2 2L6 20zM9 13l2 2M12 10l2 2M15 7l2 2"/></svg></button>
        <div id="node-value-control" class="node-value-control" hidden><input id="node-value" type="text" aria-label="Valore del nodo" autocomplete="off" /></div>
        <div id="weight-control" class="weight-control" hidden><input id="edge-weight" type="number" step="any" inputmode="decimal" aria-label="Valore dell'arco" /></div>
        <span class="divider" aria-hidden="true"></span>
        <button id="delete-tool" class="tool danger" type="button" aria-label="Elimina la selezione" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7m4 4v6m4-6v6"/></svg></button>
      </div>
    </header>
    <main class="board"><canvas id="graph-canvas" tabindex="0" aria-label="Editor di grafi: aggiungi nodi, collega due nodi, seleziona e trascina"></canvas></main>
    <div id="graph-context-menu" class="context-menu" role="menu" aria-label="Percorso" hidden>
      <button id="path-start" type="button" role="menuitem" aria-label="Imposta come nodo di partenza"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="6" cy="12" r="3"/><path d="M10 12h10m-4-4 4 4-4 4"/></svg></button>
      <button id="path-end" type="button" role="menuitem" aria-label="Imposta come nodo di arrivo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 12h10m-4-4 4 4-4 4"/><circle cx="19" cy="12" r="3"/></svg></button>
    </div>
  </body>
</html>
